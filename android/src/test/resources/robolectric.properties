# Pin the simulated Android API level for Robolectric.
#
# Without this, Robolectric reads targetSdkVersion from the merged manifest. This is a library
# module whose manifest declares no <uses-sdk>, so Robolectric fell back to its floor of API 16 -
# seven levels below this module's minSdk of 23. Tests were therefore exercising a platform the
# module does not support, and any API added after 16 (getNoBackupFilesDir(), API 21) failed at
# runtime with NoSuchMethodError even though it compiles fine against compileSdk 36.
#
# 33 is the highest level Robolectric 4.10.3 ships an android-all image for. Tests that care about
# a specific level still override it locally via ReflectionHelpers.setStaticField(SDK_INT).
sdk=33
