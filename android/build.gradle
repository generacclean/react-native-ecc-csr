// android/build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgraded to 8.6.0 to support Gradle 9.0.0 and compileSdk 36
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

apply plugin: "com.android.library"

// The Expo module glue (CSRModule.kt) needs expo-modules-core, which only exists as a Gradle project
// inside a consuming app. Standalone builds - `./gradlew test` here and in CI - have no such project,
// so they skip Kotlin entirely: .kt sources are ignored without the Kotlin plugin, and the RN/Expo-
// free CSRCore that the tests exercise still compiles and runs on its own.
//
// ExpoModulesCorePlugin.gradle is used instead of `plugins { id 'expo-module-gradle-plugin' }`
// because a plugins block cannot be applied conditionally, and that plugin only resolves inside an
// app whose settings.gradle includes Expo's plugin build.
def expoModulesCore = rootProject.findProject(":expo-modules-core")
if (expoModulesCore != null) {
    apply from: new File(expoModulesCore.projectDir, "ExpoModulesCorePlugin.gradle")
    applyKotlinExpoModulesCorePlugin()
    useCoreDependencies()
}

android {
    compileSdk 36
    namespace 'com.ecccsr'

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        consumerProguardFiles "proguard-rules.pro"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        // 17 to match what React Native's Gradle plugin configures for every library in the app,
        // so Java and Kotlin targets agree there; CI runs the standalone tests on JDK 17 too.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // Required because CSRModule.java reads BuildConfig.DEBUG to gate verbose logging.
        buildConfig true
    }

    testOptions {
        unitTests {
            // Robolectric needs the merged manifest and compiled resources on the unit-test
            // classpath. Without this it finds no manifest, falls back to "legacy resources mode",
            // and that mode is unsupported after API 28 - so it silently ran every Robolectric test
            // against its API 16 floor, seven levels below this module's minSdk of 23. Any platform
            // API added after 16 then failed at runtime with NoSuchMethodError despite compiling
            // cleanly against compileSdk 36.
            includeAndroidResources = true
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // No React Native dependency: CSRCore uses only Android and BouncyCastle APIs, and the Expo
    // glue gets expo-modules-core (and React Native through it) from useCoreDependencies() above.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.76'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.76'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
}
