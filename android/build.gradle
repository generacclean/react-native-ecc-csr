plugins {
  id 'com.android.library'
  // Applies Kotlin and the expo-modules-core dependency, and takes compileSdk/targetSdk from the
  // app. It only resolves inside an app, so the module is built and unit-tested through example/.
  id 'expo-module-gradle-plugin'
}

// Read from package.json so the publish workflow's version bump reaches the Android artifact too.
def packageVersion = new groovy.json.JsonSlurper().parse(file('../package.json')).version

group = 'com.ecccsr'
version = packageVersion

android {
  namespace 'com.ecccsr'

  defaultConfig {
    versionCode 1
    versionName packageVersion
    consumerProguardFiles 'proguard-rules.pro'
  }

  buildFeatures {
    // Required because CSRCore.kt reads BuildConfig.DEBUG to gate verbose logging.
    buildConfig true
  }

  lintOptions {
    abortOnError false
  }

  testOptions {
    unitTests {
      // Robolectric needs the merged manifest and compiled resources on the unit-test
      // classpath. Without this it finds no manifest, falls back to "legacy resources mode",
      // and that mode is unsupported after API 28 - so it silently ran every Robolectric test
      // against its API 16 floor, eight levels below the minSdk of 24 that expo-modules-core requires. Any platform
      // API added after 16 then failed at runtime with NoSuchMethodError despite compiling
      // cleanly against compileSdk 36.
      includeAndroidResources = true
    }
  }
}

dependencies {
  implementation 'org.bouncycastle:bcprov-jdk18on:1.76'
  implementation 'org.bouncycastle:bcpkix-jdk18on:1.76'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.10.3'
}
